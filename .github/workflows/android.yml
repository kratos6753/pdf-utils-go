name: Android

# Builds, tests and lints the app for every change under android/. Pushes to main
# also publish a GitHub Release with the signed APK (and the AAB for Google Play).
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runner image is pinned (not ubuntu-latest) so OS upgrades are a deliberate change.

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - id: version
        run: echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Release signing needs these repository secrets (see android/README.md). Without them
      # (forks, or before setup) the release build is debug-signed so the pipeline still runs.
      - id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "PDFUTILS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not available; the release build is debug-signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # The release bundle carries native symbol tables for Play, which needs the NDK.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - name: Lint, test and build
        env:
          PDFUTILS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PDFUTILS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PDFUTILS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew
          lintRelease testDebugUnitTest assembleRelease bundleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=${{ steps.version.outputs.name }}
          -PGOOGLE_WEB_CLIENT_ID=${{ vars.ANDROID_GOOGLE_WEB_CLIENT_ID }}

      - name: Collect outputs
        run: |
          if ! unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/'; then
            echo "::error::The bundle has no native debug symbols; Play will warn about them."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/pdf-utils-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dist/pdf-utils-${{ steps.version.outputs.name }}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/dist/mapping-${{ steps.version.outputs.name }}.txt"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: pdf-utils-android-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pdf-utils-android-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          notes="Android build $VERSION from ${GITHUB_SHA::7}."
          flags=()
          if [ "$SIGNED" != "true" ]; then
            notes="$notes Debug-signed (release keystore secrets not configured): for testing only, it can't be upgraded in place by a signed build."
            flags+=(--prerelease)
          fi
          gh release create "android-v$VERSION" dist/*.apk dist/*.aab \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PDF Utils for Android $VERSION" --notes "$notes" --generate-notes "${flags[@]}"
